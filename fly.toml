# fly.toml app configuration file generated for asr-website on 2026-11-15T22:03:57-07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'asr-website'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'aidanranney.com'
  PORT = '8080'
  DATABASE_PATH = '/mnt/website_data/website_prod.db'

[mounts]
  source = 'website_data'
  destination = '/mnt/website_data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
